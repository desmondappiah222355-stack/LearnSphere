
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyPilot</title>
    <link rel="stylesheet" href="studypilot.css">
    <link rel="icon" href="../Assets/LS.png" type="image/png">
</head>

<body class="body">

    <header class="study-header">
        <h1>StudyPilot</h1>
        <p>Your personal study assistant</p>
    </header>
    <button class="back-btn" id="back-btn">←</button>
    <main class="study-container" id="study-container">

        <section class="study-options">

            <div class="study-card" id="planner-card">
                <h3>Study Planner</h3>
                <p>Organise your study sessions.</p>
            </div>

            <div class="study-card" id="goals-card">
                <h3>Study Goals</h3>
                <p>Set and manage your learning targets.</p>
            </div>
        </section>

      
    </main>
    
    <button class="back" id="back" hidden>←</button>
  <!-- Feature display area -->
        <section class="feature-display" id="feature-display" hidden>
        </section>

    <script src="studypilot.js"></script>
</body>
</html>
