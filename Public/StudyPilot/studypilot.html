<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyPilot</title>
    <link rel="stylesheet" href="studypilot.css">
    <link rel="icon" href="../Assets/LearnSphere.png" type="image/png">
</head>
<body class="body">
    <body>

    <header class="study-header">
        <h1>StudyPilot</h1>
        <p>Your personal study assistant</p>
    </header>

    <main class="study-container">

        <section class="study-options">

            <div class="study-card" id="planner-card">
                <h3>Study Planner</h3>
                <p>Organise your study sessions.</p>
            </div>

            <div class="study-card" id="goals-card">
                <h3>Study Goals</h3>
                <p>Set and manage your learning targets.</p>
            </div>

            <div class="study-card" id="progress-card">
                <h3>My Progress</h3>
                <p>Track your learning progress.</p>
            </div>

        </section>

    </main>

</body>
</body>
<script src="studypilot.js"></script>
</html>
